# Navidrome and keep music together, for a fresh setup. Your music goes in ./music.
services:
  navidrome:
    image: deluan/navidrome:latest
    restart: unless-stopped
    environment:
      ND_SCANSCHEDULE: 1h
      ND_LYRICSPRIORITY: .lrc,embedded
    volumes:
      - navidrome-data:/data
      - ./music:/music:ro
    ports:
      - "4533:4533" # Navidrome's own UI; optional

  player:
    image: ghcr.io/findmalek/keep-player:latest
    restart: unless-stopped
    depends_on: [navidrome]
    environment:
      NAVIDROME_URL: http://navidrome:4533
      # Optional, see docs/self-hosting.md:
      # UPLOAD_DIR: /inbox                     # + a writable volume mounted at /inbox
      # GROQ_API_KEY: ${GROQ_API_KEY}          # playlists from a prompt
      # LYTERION_URL: http://lyterion-api:3001
      # LYTERION_TOKEN: ${LYTERION_TOKEN}
    ports:
      - "8080:8080"
    volumes:
      - player-data:/data
    read_only: true
    tmpfs: [/tmp]

volumes:
  navidrome-data:
  player-data:
