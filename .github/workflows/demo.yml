# The shared demo Navidrome that every preview talks to: the generated library baked into an image, deployed to Dokploy.
# Runs when the generator changes, or by hand. Skipped until DEPLOY_ENABLED is "true", see docs/previews.md.
name: Demo

on:
  push:
    branches: [main]
    paths: [scripts/demo/**, scripts/demo-library.ts, infra/demo/**, scripts/deploy/dokploy.mjs]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  demo:
    if: vars.DOKPLOY_PUBLIC_URL != '' && vars.DEPLOY_ENABLED == 'true'
    runs-on: [self-hosted, the-keep]
    timeout-minutes: 30
    env:
      DOKPLOY_URL: ${{ vars.DOKPLOY_PUBLIC_URL }}
      DOKPLOY_PUBLIC_URL: ${{ vars.DOKPLOY_PUBLIC_URL }}
      DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/demo/Dockerfile
          push: true
          tags: ghcr.io/findmalek/keep-player-demo:latest
          cache-from: type=gha,scope=demo
          cache-to: type=gha,scope=demo,mode=max,ignore-error=true
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Deploy the demo Navidrome
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN || github.token }}
          DEMO_HOST: demo.${{ vars.PREVIEW_DOMAIN }}
        run: node scripts/deploy/dokploy.mjs demo-up
