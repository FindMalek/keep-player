# Vercel-style previews on Dokploy, built on GitHub runners: one image per PR, one Dokploy app, one sticky comment.
# Skipped until the repo var DEPLOY_ENABLED is "true", see docs/previews.md. Only PRs labelled `preview` get one:
# each build pushes an image over the home line, so it's opt-in.
name: Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, closed]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  pull-requests: write

env:
  PR_NUMBER: ${{ github.event.pull_request.number }}
  PREVIEW_DOMAIN: ${{ vars.PREVIEW_DOMAIN }}
  DOKPLOY_URL: ${{ vars.DOKPLOY_PUBLIC_URL }}
  DOKPLOY_PUBLIC_URL: ${{ vars.DOKPLOY_PUBLIC_URL }}
  DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  deploy:
    if: github.event.action != 'closed' && contains(github.event.pull_request.labels.*.name, 'preview') && vars.DOKPLOY_PUBLIC_URL != '' && vars.DEPLOY_ENABLED == 'true' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, the-keep]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@v3
      - name: Build the preview image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/findmalek/keep-player:pr-${{ env.PR_NUMBER }}
          cache-from: type=local,src=/home/findmalek/.cache/buildx/keep-player
          cache-to: type=local,dest=/home/findmalek/.cache/buildx/keep-player,mode=max
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Deploy the preview
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        run: node scripts/deploy/dokploy.mjs preview-up
      - name: Mark failed
        if: failure()
        run: node scripts/deploy/dokploy.mjs comment-failed

  cleanup:
    if: github.event.action == 'closed' && vars.DOKPLOY_PUBLIC_URL != '' && vars.DEPLOY_ENABLED == 'true' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, the-keep]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Delete the preview
        run: node scripts/deploy/dokploy.mjs preview-down
