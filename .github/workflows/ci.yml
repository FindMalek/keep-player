name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Pull requests and merges run on GitHub's runners: free for a public repo, as many at once as there are jobs.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The shared Turbo cache on the-keep (turbo.findmalek.engineer): unchanged packages skip typecheck and tests.
    env:
      TURBO_API: ${{ vars.TURBO_API }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bunx biome ci .
      - run: bun run colors
      - run: bun run test
      - run: bun run size
      - run: bun scripts/config-docs.ts --check
      - run: bun scripts/shortcuts-docs.ts --check

  # The browser suite split four ways, each on its own machine. Lighthouse waits for a release (job below).
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run e2e --project=chromium --shard=${{ matrix.shard }}/4
      # Safari's engine on one shard: the app must render there too.
      - if: matrix.shard == 1
        run: bunx playwright install --with-deps webkit && bun run e2e --project=webkit
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report
          retention-days: 7

  # Conventional commits on main keep a release PR open (version bump + CHANGELOG). Merging it tags vX.Y.Z here, and
  # the image job below publishes that version: a tag pushed with GITHUB_TOKEN wouldn't start another workflow.
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Needs "Allow GitHub Actions to create pull requests" in the repo settings; never holds up a deploy without it.
    continue-on-error: true
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Pull requests: one image built on GitHub's runner and smoke-tested the way the compose example runs it.
  smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: keep-player:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: smoke test (read-only root, non-root user)
        run: |
          docker run -d --name kp --read-only --tmpfs /tmp -v kp-data:/data -p 8080:8080 \
            -e NAVIDROME_URL=http://127.0.0.1:9 keep-player:test
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/ | grep -q '<div id="root">'
          # Navidrome isn't there: readiness says so (503) without exposing its address.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/health)" = 503
          test "$(docker exec kp id -u)" = 1000
          # A bad setting stops the server with a message naming it.
          if docker run --rm -e PORT=eighty keep-player:test > bad.log 2>&1; then exit 1; fi
          grep "PORT must be" bad.log

  # Lighthouse runs alone on a quiet machine, and only for a release: it's slow and a score, not a correctness check.
  lighthouse:
    needs: release
    if: ${{ !cancelled() && (needs.release.outputs.created == 'true' || startsWith(github.ref, 'refs/tags/v')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run e2e --project=lighthouse --no-deps

  # Only a release builds and ships an image: merges to main stop at the tests. Built on GitHub's runner (fast network
  # to the registry; the home line only downloads it once when Dokploy pulls), amd64 only: that's what runs on the-keep.
  # The macOS app, built with each release and attached to it as a zip (unsigned: right-click → Open the first time).
  macos:
    needs: [check, e2e, release]
    if: ${{ !cancelled() && !failure() && needs.release.outputs.created == 'true' }}
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - run: apps/macos/build.sh
      - run: cd apps/macos/dist && ditto -c -k --keepParent "keep music.app" keep-music-macos.zip
      - run: gh release upload "v${{ needs.release.outputs.version }}" "apps/macos/dist/keep-music-macos.zip" --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  image:
    needs: [check, e2e, release]
    if: ${{ !cancelled() && !failure() && (needs.release.outputs.created == 'true' || startsWith(github.ref, 'refs/tags/v')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/findmalek/keep-player
          tags: |
            type=raw,value=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=${{ needs.release.outputs.version }},enable=${{ needs.release.outputs.created == 'true' }}
            type=raw,value=latest,enable=${{ needs.release.outputs.created == 'true' }}
            type=sha
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/attest-build-provenance@v3
        with:
          subject-name: ghcr.io/findmalek/keep-player
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  deploy:
    if: ${{ !cancelled() && needs.image.result == 'success' }}
    needs: [image, release]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: trigger dokploy
        env:
          WEBHOOK: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
        run: |
          if [ -z "$WEBHOOK" ]; then echo "DOKPLOY_WEBHOOK_URL not set, skipping"; exit 0; fi
          curl -fsS -X POST "$WEBHOOK"
      # The compose pulls the new image and restarts; the deploy only counts once the player answers again.
      # The old container keeps answering when a pull fails, so wait for the released version, not just an answer.
      - name: wait until the new version answers
        env:
          PLAYER_URL: ${{ vars.PLAYER_URL }}
          VERSION: ${{ needs.release.outputs.version || github.ref_name }}
        run: |
          if [ -z "$PLAYER_URL" ]; then echo "PLAYER_URL not set, skipping"; exit 0; fi
          want="${VERSION#v}"
          for i in $(seq 1 60); do
            got=$(curl -fsS "$PLAYER_URL/api/health" | jq -r .version 2>/dev/null || true)
            if [ "$got" = "$want" ]; then echo "live: $got"; exit 0; fi
            sleep 5
          done
          echo "still running ${got:-nothing}, wanted $want: check the deploy log in Dokploy" && exit 1
