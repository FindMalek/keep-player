<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-G7DIBHAdkwYbbinThj9KqNo7wzgcgG0CwiH9SCPt1uM='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'" />
    <meta name="referrer" content="no-referrer" />
    <title>keep music</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23101010'/%3E%3Cpath d='M5 3.5v9l7-4.5z' fill='%23ebebeb'/%3E%3C/svg%3E" />
    <style>
      /* Fonts are served by apps/api/src/fonts.ts at stable URLs. In app.css, Bun would inline them as base64. */
      @font-face {
        font-family: "IBM Plex Sans Variable";
        font-style: normal;
        font-display: swap;
        font-weight: 100 700;
        src: url("/fonts/ibm-plex-sans-latin.woff2") format("woff2-variations");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }

      @font-face {
        font-family: "IBM Plex Sans Variable";
        font-style: normal;
        font-display: swap;
        font-weight: 100 700;
        src: url("/fonts/ibm-plex-sans-latin-ext.woff2") format("woff2-variations");
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }

      @font-face {
        font-family: "JetBrains Mono Variable";
        font-style: normal;
        font-display: swap;
        font-weight: 100 800;
        src: url("/fonts/jetbrains-mono-latin.woff2") format("woff2-variations");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }

      @font-face {
        font-family: "JetBrains Mono Variable";
        font-style: normal;
        font-display: swap;
        font-weight: 100 800;
        src: url("/fonts/jetbrains-mono-latin-ext.woff2") format("woff2-variations");
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
    </style>
    <script>
      // Before first paint: pick the theme (no flash) and start the two font downloads. Kept inline on purpose;
      // Bun's HTML bundler would try to resolve preload hrefs, and the fonts are served by apps/api/src/fonts.ts.
      (() => {
        let theme = "system";
        try {
          theme = localStorage.getItem("keep-player:theme") || "system";
        } catch {}
        const dark = theme === "dark" || (theme === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.add(dark ? "dark" : "light");
        for (const name of ["ibm-plex-sans-latin", "jetbrains-mono-latin"]) {
          const link = Object.assign(document.createElement("link"), { rel: "preload", as: "font", type: "font/woff2", crossOrigin: "", href: `/fonts/${name}.woff2` });
          document.head.append(link);
        }
      })();
    </script>
    <link rel="stylesheet" href="./app.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
